<!DOCTYPE html>
<html>
<head>
    <title>Chess Board</title>

    <style>
        /* Page alignment */
        body {
            text-align: center;
        }

        /* Top right number */
        .top-right {
            position: absolute;
            top: 10px;
            right: 20px;
            font-weight: bold;
        }

        /* Chessboard container */
        #board {
            width: 480px;
            height: 480px;
            margin: 20px auto;   /* Centers board */
        }

        /* Each square */
        .square {
            width: 60px;
            height: 60px;
            float: left;
        }

        /* Black squares */
        .black {
            background-color: black;
        }

        /* White squares */
        .white {
            background-color: white;
        }
    </style>

</head>
<body>

    <!-- Top Right Roll Number -->
    <div class="top-right">160124737162</div>

    <h1>Chess Board</h1>

    <div id="board">

        <!-- Row 1 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 2 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 3 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 4 -->

        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 5 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <div class="square white"></div>

        <!-- Row 6 -->

        <!-- Row 7 -->
        <div class="square black"></div>

        <!-- Row 8 -->

    </div>

</body>
</html>
